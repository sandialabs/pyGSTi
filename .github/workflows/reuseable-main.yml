# This is the core workflow for running pyGSTi linting and unit tests
# This is used by other workflows to call this on a variety of OS/Python/environment options
# By doing it this way, we can quickly call different matrix jobs on different branches

name: Core pyGSTi build and run tests

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python-version:
        required: true
        type: string
      use-cython:
        required: true
        type: string
      run-unit-tests:
        required: true
        type: string
      run-integration-tests:
         required: true
         type: string
      run-extra-tests:
        required: true
        type: string
      run-notebook-tests:
        required: true
        type: string
      # Whether THIS matrix entry measures coverage. Callers set it true for exactly
      # one job (ubuntu + highest Python, where coverage.py's sysmon core keeps the
      # tracer cheap on 3.12+). CI never uploads the report, so measuring it on every
      # job is pure overhead; one job preserves a human-readable number in the logs.
      run-coverage:
        required: false
        type: string
        default: 'false'
      # Branch to diff HEAD against to decide whether the slow graphcoloring
      # scaling tests should run (see the "Detect graphcoloring net changes"
      # step below). Leave unset/empty to always skip that diff check (e.g.
      # for direct pushes to protected branches, where these tests are never
      # opted into automatically).
      graphcoloring-diff-base:
        required: false
        type: string
        default: ''

env:
  SKIP_DEAP: 1
  PYGSTI_NO_CUSTOMLM_SIGINT: 1
  # Resolve PyTorch (an explicit CI-build test dependency) from the CPU-only wheel index
  # instead of pip's default CUDA build. The latter drags in ~2.5 GB of nvidia-* wheels
  # that CI never uses. uv honors this for every resolution in the job.
  UV_TORCH_BACKEND: cpu
  # Use coverage.py's sys.monitoring core (PEP 669) for --cov runs. Python 3.12's
  # specializing adaptive interpreter de-optimizes the legacy C trace function,
  # which made coverage of call-heavy tests (e.g. the errgenproptools error-generator
  # composition tests) ~40x slower on 3.12 than on 3.9 -- a Python-version effect
  # previously misread as a numpy-2 regression. sysmon restores near-native speed;
  # it falls back gracefully (with a CoverageWarning) on Python < 3.12.
  COVERAGE_CORE: sysmon

jobs:
  build-and-test:
    if: ${{ inputs.use-cython == 'true' || inputs.os == 'ubuntu-latest' }}
    runs-on: ${{ inputs.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up installation environment (Linux)
      if: ${{ inputs.os == 'ubuntu-latest' }}
      run: |
        ./.github/ci-scripts/before_install.sh
    - name: Set up installation environment (MacOS)
      if: ${{ inputs.os == 'macos-latest' }}
      run: |
        ./.github/ci-scripts/before_install_macos.sh
    - name: Set up MPI (Windows)
      if: ${{ inputs.os == 'windows-latest' }}
      uses: mpi4py/setup-mpi@v1
      with:
        mpi: intelmpi
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    # uv gives fast, parallel installs and CPU-only torch resolution (see env above).
    # The astral-sh/setup-uv action is blocked by the org Actions allowlist, so we
    # bootstrap uv from PyPI with the stock pip (a `run:` step is not an action) and
    # cache its downloads with the GitHub-owned actions/cache.
    - name: Set up uv
      run: python -m pip install --upgrade pip uv
    - name: Cache uv downloads
      uses: actions/cache@v4
      with:
        # Default uv cache dir, listed for each OS; non-matching paths are skipped.
        path: |
          ~/.cache/uv
          ~/Library/Caches/uv
          ~\AppData\Local\uv\cache
        # Key on the real dependency manifests (deps live in pyproject.toml).
        key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'setup.py') }}
        restore-keys: |
          ${{ runner.os }}-uv-
    - name: Install build and lint tools
      # flake8 for the lint step; setuptools/wheel kept on hand for any dependency that
      # still imports pkg_resources at runtime.
      run: uv pip install --system setuptools wheel flake8
    - name: Install package (Cython)
      if: ${{ inputs.use-cython == 'true' }}
      # The PEP 660 editable install compiles the Cython extensions in-place via build
      # isolation, so a separate `setup.py build_ext --inplace` is redundant (verified:
      # the editable install alone yields importable .so for all 19 extensions).
      run: |
        uv pip install --system -e .[testing,pytorch]
    - name: Install package (No Cython, Linux only)
      if: ${{ inputs.use-cython != 'true' && inputs.os == 'ubuntu-latest' }}
      run: |
        PYGSTI_CYTHON_SKIP=1 uv pip install --system -e .[testing_no_cython,pytorch]
    - name: Lint with flake8 (Linux only)
      if: ${{ inputs.os == 'ubuntu-latest'}}
      run: |
        # Critical errors, exit on failure
        flake8 . --count --show-source --statistics --config=.flake8-critical
        # Standard PEP8, allowed to fail since exit-zero treats all errors as warnings
        flake8 . --exit-zero --statistics

    - name: Run unit tests
      if: ${{ inputs.run-unit-tests == 'true' }}
      # bash on every runner (Git Bash on Windows) so $COV_FLAG expands portably.
      shell: bash
      env:
        COV_FLAG: ${{ inputs.run-coverage == 'true' && '--cov=pygsti' || '' }}
      run: |
        python -Ic "import pygsti; print(pygsti.__version__); print(pygsti.__path__)"
        # Wall-clock-sensitive suites live under test/performance/ and so are not
        # collected here at all; the graphcoloring scaling suite is run
        # conditionally in its own step below, where a slow run can't eat into or
        # fail the main unit-test budget. The `-m "not slow"` filter is kept as a
        # backstop in case a benchmark-style test lands under test/unit again.
        python -m pytest -n auto --dist loadscope -m "not slow" $COV_FLAG --durations=25 test/unit
    - name: Detect graphcoloring net changes
      # The graphcoloring scaling tests are slow, so only run them when this branch
      # has a net diff against `graphcoloring-diff-base` in the graphcoloring
      # toolkit or its tests.
      #
      # This is intentionally independent of *how* this run was triggered (push vs.
      # pull_request): callers that care (currently just feature-branches.yml) pass
      # graphcoloring-diff-base explicitly, so this works the same whether CI was
      # kicked off by a push to a branch or by an actual pull_request event -- the
      # older implementation kept re-deriving the base from
      # github.event.pull_request.base.sha, which is empty on ordinary push events.
      # Since same-repo (non-fork) PRs only ever get a push event here (see the
      # pull_request trigger filter in feature-branches.yml), that meant this step
      # silently always reported changed=false for those PRs, e.g. #848.
      #
      # This uses a real git diff, not a "files touched" list, so if a branch
      # changes graphcoloring and then reverts those changes, this reports
      # changed=false. We only want to run the scaling tests once.
      id: graphcoloring
      if: ${{ inputs.run-unit-tests == 'true' }}
      shell: bash
      env:
        DIFF_BASE: ${{ inputs.graphcoloring-diff-base }}
      run: |
        set -euo pipefail

        # Callers that don't opt in (e.g. direct pushes to develop/beta/master/
        # bugfix) leave this empty, so never run the slow graphcoloring tests there.
        if [ -z "${DIFF_BASE}" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git fetch --no-tags --depth=1 origin "${DIFF_BASE}"

        if git diff --quiet "origin/${DIFF_BASE}" HEAD -- \
          pygsti/tools/graphcoloring \
          test/unit/tools/test_graphcoloring.py \
          test/performance/test_graphcoloring_scaling.py \
          test/helpers/graphcoloring_graphs.py
        then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Run graphcoloring slow (scaling) tests
      if: ${{ inputs.run-extra-tests == 'true' && steps.graphcoloring.outputs.changed == 'true' }}
      timeout-minutes: 30
      shell: bash
      env:
        GRAPHCOLORING_CHANGED: ${{ steps.graphcoloring.outputs.changed }}
      run: |
        python -Ic "import pygsti; print(pygsti.__version__); print(pygsti.__path__)"
        python -m pytest -m slow --durations=25 test/performance/test_graphcoloring_scaling.py
    - name: Run workflow tests
      if: ${{ inputs.run-integration-tests == 'true' }}
      shell: bash
      env:
        COV_FLAG: ${{ inputs.run-coverage == 'true' && '--cov=pygsti' || '' }}
      run: |
        python -Ic "import pygsti; print(pygsti.__version__); print(pygsti.__path__)"
        python -m pytest -n auto --dist loadscope $COV_FLAG test/integration
    - name: Install ml extra (TensorFlow/Keras) for test_packages
      # test/test_packages/extras/ml exercises pygsti.extras.ml, which needs TensorFlow and
      # Keras. Those are deliberately not in the `testing` extra -- TensorFlow is a heavy,
      # platform-specific dependency that the other ~99% of the suite has no use for -- so
      # install them only for the jobs that actually run test_packages. Without this the ml
      # tests would be silently skipped by their pytest.importorskip guard rather than run.
      #
      # Skipped on 3.14: TensorFlow has no Python 3.14 wheels yet (tracked upstream at
      # tensorflow/tensorflow#102890), so `uv pip install .[ml]` fails outright there instead
      # of resolving anything. Leaving TensorFlow uninstalled on 3.14 just means the ml tests
      # fall back to their normal pytest.importorskip skip, same as any machine lacking the
      # `ml` extra. Drop the python-version guard once that issue ships 3.14 wheels.
      if: ${{ inputs.run-extra-tests == 'true' && inputs.python-version != '3.14' }}
      run: |
        uv pip install --system -e .[ml]
        python -Ic "import tensorflow, keras; print('tensorflow', tensorflow.__version__, '/ keras', keras.__version__)"
    - name: Run test_packages
      if: ${{ inputs.run-extra-tests == 'true' }}
      run: |
        python -Ic "import pygsti; print(pygsti.__version__); print(pygsti.__path__)"
        python -m pytest -v -n auto --dist loadscope --ignore=test/test_packages/notebooks --durations=25 test/test_packages
    - name: Execute the docs notebooks
      # Linux-only: this step compiles CHP with gcc and writes it to /usr/local/bin,
      # so it cannot run on the Windows/macOS runners even if a caller requests it.
      #
      # This replaces a `pytest --nbval-lax` run. That run only ever asserted "no
      # cell raised": no notebook uses NBVAL_CHECK_OUTPUT or the nbval-check-output
      # tag, so nbval never compared an output against anything. The driver asserts
      # the same property -- its exit status is nonzero if any cell errored, even
      # under --allow-errors -- and additionally *keeps* the outputs, which
      # develop.yml's docs-notebooks job commits so the hosted docs render executed
      # results instead of bare source. See docs/execute-notebooks.py.
      if: ${{ inputs.run-notebook-tests == 'true' && inputs.os == 'ubuntu-latest' }}
      run: |
        set -euo pipefail

        # The `ml` extra (TensorFlow + Keras) backs docs/markdown/advanced/ml/QPANN,
        # which imports pygsti.extras.ml. It is pulled in here rather than added to
        # `docs` itself so that ReadTheDocs -- which installs `.[docs]` but never
        # executes a notebook (docs/_config.yml sets execute_notebooks: 'off') -- isn't
        # made to download TensorFlow purely to render Markdown.
        uv pip install --system -e .[docs]
        uv pip install --system -e .[ml] \
          || echo "::warning::ml extra would not install on Python ${{ inputs.python-version }}"

        # Whether QPANN can run is decided by *probing for TensorFlow*, not by testing
        # inputs.python-version against a hardcoded string. TensorFlow lags new Python
        # releases by months (no 3.14 wheels yet: tensorflow/tensorflow#102890), and the
        # version that lags moves every year, so a pinned-version guard is wrong by
        # default between rollforwards. The predecessor of this line demonstrated the
        # failure mode: it passed `--ignore=docs/markdown/ml` to nbval, a path that
        # matched nothing -- the tutorial is at docs/markdown/advanced/ml -- and stayed
        # broken indefinitely because its 3.14 branch was unreachable and so never ran.
        #
        # --exclude-also, not --exclude: --exclude REPLACES the driver's built-in list
        # and would silently start executing the two pages that ship outputless by design.
        NB_EXCLUDE_ML=""
        if ! python -Ic "import tensorflow, keras" >/dev/null 2>&1; then
          echo "::warning::TensorFlow/Keras unavailable; advanced/ml/QPANN will ship without output"
          NB_EXCLUDE_ML="--exclude-also advanced/ml/QPANN"
        fi

        # Tutorials live as MyST Markdown under docs/markdown/; jupytext pairs each
        # .md with an .ipynb sitting NEXT TO IT in the same directory (see
        # docs/jupytext.toml). The .md side is `md:myst`, which cannot carry outputs
        # at all, so the .ipynb is the only place execution results can live.
        (cd docs && jupytext --sync 'markdown/**/*.md')

        # Cross-notebook inputs: Example_GST_Data, the two Example_Dataset*.txt, and
        # the shared GST results tree. pytest used to materialize these through
        # docs/conftest.py's autouse fixture; the driver is not pytest, so the
        # generator has to be called directly.
        python -c "import sys; sys.path.insert(0, 'docs'); import conftest; conftest._generate_shared_fixtures()"

        # Download and compile CHP for the Clifford-simulation notebook;
        # put the binary on PATH so pygsti.evotypes.chp.chpexe = 'chp' resolves.
        curl -o /tmp/chp.c https://www.scottaaronson.com/chp/chp.c
        gcc -o /usr/local/bin/chp /tmp/chp.c

        python -Ic "import pygsti; print(pygsti.__version__); print(pygsti.__path__)"
        # --allow-errors keeps going past a failing cell so one broken notebook does
        # not hide the state of the other 75; the exit status still reports failure,
        # so this step fails the job exactly as the nbval step did.
        python docs/execute-notebooks.py --jobs 4 --timeout 1800 --allow-errors $NB_EXCLUDE_ML

    - name: Upload executed notebooks
      # Consumed by develop.yml's docs-notebooks job, which commits them onto the
      # develop-with-notebooks branch that ReadTheDocs builds. Artifacts are scoped
      # to a workflow run, and a reusable workflow shares its caller's run, so the
      # download in that job resolves to this upload.
      #
      # Uploaded even when execution failed: with --allow-errors the failing cell's
      # traceback is recorded *in the notebook*, which is the most useful debugging
      # artifact this job produces.
      if: ${{ always() && inputs.run-notebook-tests == 'true' && inputs.os == 'ubuntu-latest' }}
      uses: actions/upload-artifact@v4
      with:
        name: executed-notebooks
        # Only the .ipynb. Executing the tutorials also litters docs/markdown/ with
        # offline/ asset dirs and *_checkpoints/ trees (both gitignored, but
        # docs-notebooks force-adds that directory). Filtering here is what keeps
        # that job from having to clean up after a run it did not perform.
        path: docs/markdown/**/*.ipynb
        if-no-files-found: error
        retention-days: 7

    - name: Upload notebook execution logs
      # Per-notebook stdout/stderr from the driver, for diagnosing a failure without
      # re-running a ~40 minute job.
      if: ${{ always() && inputs.run-notebook-tests == 'true' && inputs.os == 'ubuntu-latest' }}
      uses: actions/upload-artifact@v4
      with:
        name: notebook-execution-logs
        path: nb-exec-logs
        if-no-files-found: warn
        retention-days: 7
