# This workflow runs a moderate test suite on develop
# This includes all versions of supported Python, no MacOS, only unit tests,
# and only tests environments with Cython in them

name: Build and run tests (develop)

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch: # Allow manual running from GitHub

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # No Mac
        python-version: ['3.10', '3.11', '3.12', '3.13']
        use-cython: ['true', 'false']
    uses: ./.github/workflows/reuseable-main.yml
    name: Run pyGSTi tests
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      run-coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && matrix.use-cython == 'true' }} # cover exactly one job
      use-cython: 'true' # Cython only
      run-unit-tests: 'true'
      run-integration-tests: 'true'
      run-extra-tests: 'false' # No integration tests
      # Run the docs notebook regression on exactly one job (Linux + newest Python +
      # Cython), the same single-job pattern used for run-coverage above. The suite is
      # slow, so we don't fan it out across the whole matrix.
      run-notebook-tests: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && matrix.use-cython == 'true' }}

  push: # Push to stable "beta" branch on successful build
    runs-on: ubuntu-latest

    # Only run on "develop" branch if tests pass
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.PYGSTI_TOKEN }}
    - name: Merge changes to beta branch
      run: |
        git config --global user.name 'PyGSTi'
        git config --global user.email 'pygsti@noreply.github.com'
        git checkout beta
        git merge --ff-only ${GITHUB_SHA} && git push origin beta

  docs-notebooks: # Rebuild the ReadTheDocs "develop-with-notebooks" branch
    # ReadTheDocs builds the hosted docs from `develop-with-notebooks`, NOT from
    # `develop`. That branch is `develop` with each notebook page's *.md replaced by
    # an *.ipynb carrying that page's executed output -- so the hosted pages show
    # results rather than bare source, and the Colab/Binder launch buttons (which
    # fetch from GitHub) resolve to real notebooks.
    #
    # The assembly lives in a reusable workflow because docs-staging.yml stages
    # preview branches the same way. Keeping one implementation means a preview
    # exercises this exact code, so "it rendered correctly on the preview branch"
    # actually says something about what develop will publish.

    # Only after tests pass on a push to develop.
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    uses: ./.github/workflows/stage-docs-branch.yml
    with:
      source-sha: ${{ github.sha }}
      target-branch: develop-with-notebooks
      # The .md every notebook page is generated from lives on develop; that is
      # where Show source / Suggest edit should land a contributor.
      edit-branch: develop
    secrets:
      PYGSTI_TOKEN: ${{ secrets.PYGSTI_TOKEN }}
