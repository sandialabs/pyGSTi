# This workflow runs a moderate test suite on develop
# This includes all versions of supported Python, no MacOS, only unit tests,
# and only tests environments with Cython in them

name: Build and run tests (develop)

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch: # Allow manual running from GitHub

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # No Mac
        python-version: ['3.10', '3.11', '3.12', '3.13']
        use-cython: ['true', 'false']
    uses: ./.github/workflows/reuseable-main.yml
    name: Run pyGSTi tests
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      run-coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && matrix.use-cython == 'true' }} # cover exactly one job
      use-cython: 'true' # Cython only
      run-unit-tests: 'true'
      run-integration-tests: 'true'
      run-extra-tests: 'false' # No integration tests
      # Run the docs notebook regression on exactly one job (Linux + newest Python +
      # Cython), the same single-job pattern used for run-coverage above. The suite is
      # slow, so we don't fan it out across the whole matrix.
      run-notebook-tests: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && matrix.use-cython == 'true' }}

  push: # Push to stable "beta" branch on successful build
    runs-on: ubuntu-latest

    # Only run on "develop" branch if tests pass
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.PYGSTI_TOKEN }}
    - name: Merge changes to beta branch
      run: |
        git config --global user.name 'PyGSTi'
        git config --global user.email 'pygsti@noreply.github.com'
        git checkout beta
        git merge --ff-only ${GITHUB_SHA} && git push origin beta

  docs-notebooks: # Rebuild the ReadTheDocs "develop-with-notebooks" branch
    # ReadTheDocs builds the hosted docs from `develop-with-notebooks`, NOT from
    # `develop`. That branch is `develop` with each notebook page's *.md replaced by
    # an *.ipynb carrying that page's executed output -- so the hosted pages show
    # results rather than bare source, and the Colab/Binder launch buttons (which
    # fetch from GitHub) resolve to real notebooks. We regenerate the whole branch as
    # a single atomic, force-pushed commit so RTD never sees a half-built state.
    runs-on: ubuntu-latest

    # Only after tests pass on a push to develop.
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.PYGSTI_TOKEN }}
    # Nothing is generated here. The executed .ipynb come from the notebook step in
    # the `build` matrix (reuseable-main.yml), which ran against this same commit, so
    # this job needs neither Python nor jupytext -- it only rearranges files and commits.
    - name: Download executed notebooks
      uses: actions/download-artifact@v4
      with:
        name: executed-notebooks
        path: docs/markdown
    - name: Build develop-with-notebooks branch
      run: |
        set -euo pipefail
        git config --global user.name 'PyGSTi'
        git config --global user.email 'pygsti@noreply.github.com'

        # upload-artifact roots its archive at the least-common ancestor of the files
        # it matched -- docs/markdown, since notebooks live under advanced/, guides/
        # and start/. Check the shape survived rather than trusting it: a mis-rooted
        # download would push a branch with no notebooks at all, and RTD would render
        # prose-only pages with nothing anywhere reporting a problem.
        n=$(find docs/markdown -name '*.ipynb' -not -path '*/.ipynb_checkpoints/*' | wc -l)
        echo "downloaded ${n} executed notebooks"
        if [ "${n}" -lt 70 ]; then
          echo "::error::expected ~76 executed notebooks under docs/markdown, found ${n}"
          exit 1
        fi

        # Start the branch from the exact develop commit that just passed tests. The
        # downloaded .ipynb are gitignored on develop, so they survive this untouched.
        git checkout -B develop-with-notebooks ${GITHUB_SHA}

        # Render from the .ipynb, not the .md. Sphinx picks ONE source per document,
        # and jupyter-book warns "multiple files found for the document" -- 74 times --
        # when both exist. That warning is logged without a type=, so suppress_warnings
        # cannot silence it and any -W build fails on it. Dropping the superseded .md
        # also removes the dependence on the undocumented accident that "ipynb" sorts
        # before "md", which is the only reason the .ipynb would win otherwise.
        #
        # Plain-markdown pages -- index and landing pages, which carry no jupytext
        # header and so have no paired .ipynb -- are left alone. This uses find rather
        # than a `docs/markdown/**/*.ipynb` glob so it does not depend on `shopt -s
        # globstar`, which the previous version of this job set and which silently
        # matches only one directory level deep on any shell that lacks it.
        find docs/markdown -name '*.ipynb' -not -path '*/.ipynb_checkpoints/*' -print0 \
          | while IFS= read -r -d '' nb; do rm -f "${nb%.ipynb}.md"; done

        # Point the hosted build's launch links at this branch (the
        # edit_button_branch extension keeps Show source / Suggest edit on develop,
        # where the .md this page was written from still exists). Only the
        # repository.branch key (2-space indent) is rewritten; the
        # pygsti_edit_branch value stays on develop. The trailing comment is kept.
        sed -i -E 's|^(  branch: )develop\b(.*)$|\1develop-with-notebooks\2|' docs/_config.yml
        grep -q '^  branch: develop-with-notebooks' docs/_config.yml  # fail loudly if the rewrite missed
        # -A so the .md deletions stage, -f because .ipynb is gitignored on develop.
        # Only .ipynb was downloaded, so the offline/ asset dirs and *_checkpoints/
        # trees that executing the tutorials leaves behind are not here to be swept in.
        git add -A -f docs/markdown
        git add docs/_config.yml
        git commit -m "Auto-build notebooks for ReadTheDocs [skip ci]"
        git push --force origin develop-with-notebooks





