# Read the Docs configuration file for the pyGSTi Jupyter Book.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  commands:
    # rtd-requirements.txt installs `.[docs]` which pulls in pyGSTi itself
    # plus jupyter-book, jupytext, matplotlib, numpy.
    # PYGSTI_SKIP_CYTHON: the API docs only need pyGSTi importable; the
    # pure-Python fallback reps suffice, so don't spend build time compiling.
    - PYGSTI_SKIP_CYTHON=1 pip install -r rtd-requirements.txt
    # Unpack the example HTML reports into docs/_extra, which _config.yml
    # publishes through html_extra_path so they land at /reports/ on the site.
    # docs/reports.tar.xz is committed onto this branch by stage-rtd-branch.py,
    # alongside the executed notebooks; both are generated by the same run.
    - python docs/collect-reports.py extract
    - jb build docs/
    # .doctrees is Sphinx's intermediate cache (~130 MB); don't publish it.
    - rm -rf docs/_build/html/.doctrees
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - cp -r docs/_build/html/. $READTHEDOCS_OUTPUT/html/
